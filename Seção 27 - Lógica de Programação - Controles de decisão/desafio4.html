<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        let variavel = 1;

        
        switch(typeof variavel){
            case "number":
                alert("Número");
                break;
            case "string":
                alert("Texto");
                break;
            case "boolean":
                alert("Boleana");
                break;
            case "undefined":
                alert("Undefined");
                break;
            default:
                alert("Nenhum tipo")
        }

    </script>
</body>
</html>
