<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Mostrar média</h1>

    <script>
        let n1 = prompt("Digite um número: ");
        n1 = parseFloat(n1);

        let n2 = parseFloat(prompt("Digite outro número: "));

        let media = (n1 + n2) / 2;

        alert("A média é: " + media);
    </script>
</body>
</html>
