<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Desafio 2</h1>

    <script>
        let numero = 10;

        numero += 5;

        numero *= 5;

        numero++;

        alert("O resultado da divisão de " + numero + " por 6 é: " + numero % 6);

        alert("O quadrado do resto da divisão de " + numero + " por 6 é: " + ((numero % 6) ** 2));

        alert(numero);

        numero /= 4;

        alert(numero);
    </script>
</body>
</html>
