<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exercicio</h1>

    <script>
        let n = parseFloat(prompt("Digite um número para que faça-o a multiplicação até o 10: "))

        if(!isNaN(n)){
            let contador = 0;

            while(contador <= 10){
                document.write(n + " x " + contador + " = " + n * contador + "<br>");

                contador++;
            }
        }else{
            alert("Digite números.")
        }

    </script>
</body>
</html>
